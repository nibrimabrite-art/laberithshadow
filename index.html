<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leyusionis | Portal de Contacto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #f59e0b; /* Atardecer dorado */
            --secondary: #0ea5e9; /* Océano superficial */
            --dark: #020617; /* Abismo marino */
        }

        body {
            background-color: var(--dark);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .font-mystic { font-family: 'Playfair Display', serif; }

        /* Escenario de fondo: El mar y el cielo de Leyusionis */
        .scenery-field {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, 
                #f59e0b 0%,   /* Ocre en el cielo alto */
                #0284c7 40%,  /* Mar azul */
                #020617 100%  /* Abismo en el fondo */
            );
        }

        .sparkles-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><circle cx="30" cy="40" r="1.2" fill="%23ffffff" opacity="0.3"/><circle cx="120" cy="80" r="1.8" fill="%23f59e0b" opacity="0.5"/><circle cx="160" cy="150" r="1" fill="%23ffffff" opacity="0.2"/><circle cx="70" cy="180" r="1.5" fill="%2338bdf8" opacity="0.4"/></svg>') repeat;
            animation: drift 40s linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Paneles de vidrio esmerilado */
        .glass-panel {
            background: rgba(8, 15, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
        }

        /* Efectos de inputs */
        .custom-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
            outline: none;
            background: rgba(15, 23, 42, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div class="scenery-field">
        <div class="sparkles-overlay"></div>
    </div>

    <!-- Cabecera de Navegación Simple -->
    <header class="w-full z-50 glass-panel border-b border-amber-500/10 fixed top-0">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="font-mystic text-lg font-bold tracking-[0.2em] text-white glow-text uppercase">LEYUSIONIS</span>
                <span class="text-[8px] tracking-[0.4em] text-amber-300 font-bold uppercase">Portal de Contacto</span>
            </div>
            <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest text-amber-300 hover:text-white flex items-center gap-2 transition-all">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Volver al Inicio
            </a>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-6 pt-32 pb-16 w-full relative z-10 flex-grow flex flex-col gap-10 justify-center">
        
        <div class="glass-panel p-6 md:p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/5 rounded-full blur-2xl"></div>
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div>
                    <h3 class="font-mystic text-xl text-white uppercase tracking-wide flex items-center gap-2">
                        <i data-lucide="video" class="text-amber-400 w-5 h-5"></i> Videoteca del Universo Rúnico
                    </h3>
                    <p class="text-[10px] text-slate-300 uppercase tracking-widest mt-1">Avances y videos oficiales de nuestro universo rúnico</p>
                </div>
            </div>

            <!-- Contenedor de miniaturas de videos -->
            <div id="video-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Se inyecta dinámicamente con JavaScript -->
            </div>
        </div>

        <div class="glass-panel p-8 md:p-10 rounded-3xl shadow-2xl relative overflow-hidden max-w-2xl mx-auto w-full">
            <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl"></div>
            
            <div class="text-center mb-8">
                <h2 class="font-mystic text-3xl md:text-4xl text-white mb-2 uppercase tracking-wide">Escríbeme un Mensaje</h2>
                <p class="text-xs text-slate-300 uppercase tracking-widest leading-relaxed">Tus pensamientos navegarán por el océano digital directo a mi bandeja</p>
            </div>

            <form id="contact-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                <!-- Campo Oculto para procesar el envío de Web3Forms -->
                <input type="hidden" name="access_key" id="web3forms-key" value="">
                <!-- Evita redirecciones molestas de páginas externas -->
                <input type="hidden" name="redirect" value="">
                
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-amber-300 font-bold mb-2">Tu Nombre</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                            <input type="text" name="name" id="form-name" required placeholder="Ej. Hilda del Mar" 
                                   class="w-full custom-input pl-10 pr-4 py-3 rounded-xl text-sm text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-amber-300 font-bold mb-2">Tu Correo de Contacto</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                            <input type="email" name="email" id="form-email" required placeholder="tu-correo@ejemplo.com" 
                                   class="w-full custom-input pl-10 pr-4 py-3 rounded-xl text-sm text-white">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-amber-300 font-bold mb-2">Asunto</label>
                    <div class="relative">
                        <i data-lucide="tag" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" name="subject" id="form-subject" required placeholder="Ej. El Linaje del Mar" 
                               class="w-full custom-input pl-10 pr-4 py-3 rounded-xl text-sm text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-amber-300 font-bold mb-2">Tu Mensaje</label>
                    <div class="relative">
                        <i data-lucide="message-square" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                        <textarea name="message" id="form-message" required rows="5" placeholder="Escribe aquí tu carta rúnica..." 
                                  class="w-full custom-input pl-10 pr-4 py-3 rounded-xl text-sm text-white resize-none"></textarea>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-amber-500 to-sky-500 hover:from-amber-400 hover:to-sky-400 text-white font-bold uppercase tracking-widest text-xs py-4 px-6 rounded-xl transition-all hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 shadow-lg">
                    <i data-lucide="send" class="w-4 h-4"></i> Enviar Mensaje
                </button>
            </form>
        </div>
    </main>

    <div id="video-modal" class="fixed inset-0 z-50 bg-black/90 hidden items-center justify-center p-4 transition-all duration-300">
        <div class="relative w-full max-w-3xl aspect-video glass-panel rounded-2xl overflow-hidden shadow-2xl border border-white/10">
            <button onclick="closeVideoModal()" class="absolute top-4 right-4 z-10 bg-black/50 hover:bg-red-600 text-white p-2 rounded-full transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modal-player-container" class="w-full h-full">
                <!-- Se inyecta el iframe aquí dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Notificaciones Flotantes Integradas (Toasts) -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-500 pointer-events-none">
        <div class="glass-panel px-6 py-4 rounded-2xl flex items-center gap-3 border-amber-500/30 shadow-xl">
            <div id="toast-icon-container" class="p-2 rounded-xl">
                <!-- Se inyecta icono de forma dinámica -->
            </div>
            <div>
                <p id="toast-title" class="text-xs font-bold text-white uppercase tracking-wider"></p>
                <p id="toast-desc" class="text-[10px] text-slate-300 mt-0.5"></p>
            </div>
        </div>
    </div>

    <!-- Pie de página unificado -->
    <footer class="w-full py-8 border-t border-white/5 mt-auto relative z-10 bg-black/40 text-center">
        <span class="font-mystic text-lg tracking-[0.2em] text-white uppercase glow-text">LEYUSIONIS</span>
        <p class="text-[8px] text-slate-500 uppercase tracking-[0.4em] mt-2">Buscadores de la Mejor Versión • Conexión Rúnica</p>
    </footer>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // =========================================================================
        // CONFIGURACIÓN PRIVADA DE TU BANDEJA:
        // Pega tu Access Key de Web3Forms aquí dentro de las comillas.
        // =========================================================================
        const WEB3FORMS_ACCESS_KEY = ""; 

        // Sincronizar clave al cargar la página
        if (WEB3FORMS_ACCESS_KEY) {
            document.getElementById('web3forms-key').value = WEB3FORMS_ACCESS_KEY.trim();
        }

        // =========================================================================
        // VIDEOS DE TU CANAL (ADMINISTRACIÓN POR CÓDIGO):
        // Agrega, cambia o elimina los enlaces de tus videos aquí dentro de la lista.
        // Solo debes pegar el enlace completo (normal o Short) dentro de las comillas.
        // Asegúrate de separar cada enlace con una coma ( , ).
        // =========================================================================
        const ADMIN_VIDEOS = [
            "https://www.youtube.com/shorts/mmIUaAhUL2c"
            // Puedes agregar más videos siguiendo este formato:
            // "https://www.youtube.com/watch?v=ID_DE_OTRO_VIDEO",
        ];

        // Función para extraer la ID de YouTube de cualquier enlace (normal o Short)
        function getYouTubeId(url) {
            // Manejar enlaces estilo Shorts de YouTube
            if (url.includes('/shorts/')) {
                const parts = url.split('/shorts/');
                if (parts[1]) {
                    return parts[1].split(/[?#]/)[0];
                }
            }
            // Manejar formato estándar e integraciones compartidas
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\/\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Renderizar la grilla de videos de forma interactiva
        function renderVideos() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = "";

            // Filtrar y extraer IDs válidas de la lista privada de administración
            const validVideos = getAdminItems();

            if (validVideos.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-6 border border-dashed border-white/10 rounded-2xl bg-black/20">
                        <i data-lucide="video-off" class="w-8 h-8 text-slate-500 mx-auto mb-2"></i>
                        <p class="text-[10px] text-slate-400 uppercase tracking-widest">No se han configurado videos en este portal</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            validVideos.forEach((video) => {
                // Obtener imagen de miniatura de alta definición de YouTube
                const thumbUrl = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
                
                const card = document.createElement('div');
                card.className = "group relative aspect-video rounded-xl overflow-hidden glass-panel border border-white/10 hover:border-amber-500/40 transition-all cursor-pointer shadow-lg";
                card.innerHTML = `
                    <img src="${thumbUrl}" alt="Miniatura de Video" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onclick="playVideo('${video.id}')">
                    
                    <!-- Capa de Play flotante -->
                    <div class="absolute inset-0 bg-black/30 group-hover:bg-black/50 flex items-center justify-center transition-all" onclick="playVideo('${video.id}')">
                        <div class="w-10 h-10 rounded-full bg-amber-500/90 text-white flex items-center justify-center transform group-hover:scale-110 transition-all shadow-md">
                            <i data-lucide="play" class="w-5 h-5 fill-white ml-0.5"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // Obtener lista limpia de objetos de video con ID
        function getAdminItems() {
            return ADMIN_VIDEOS
                .map(url => {
                    const id = getYouTubeId(url);
                    return id ? { id, url } : null;
                })
                .filter(v => v !== null);
        }

        // Abrir reproductor modal flotante
        function playVideo(id) {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-player-container');
            
            // Inyectar el reproductor en un iframe optimizado de YouTube
            container.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" 
                        class="w-full h-full" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            `;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // Cerrar reproductor modal
        function closeVideoModal() {
            const modal = document.getElementById('video-modal');
            const container = document.getElementById('modal-player-container');
            
            // Destruir el iframe para detener el audio del video de fondo
            container.innerHTML = "";
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Cargar videos iniciales al abrir la pestaña
        window.addEventListener('DOMContentLoaded', () => {
            renderVideos();
        });


        // --- NOTIFICACIONES Y TOASTS ---

        function showToast(title, desc, type) {
            const toast = document.getElementById('toast');
            const tTitle = document.getElementById('toast-title');
            const tDesc = document.getElementById('toast-desc');
            const tIcon = document.getElementById('toast-icon-container');

            tTitle.textContent = title;
            tDesc.textContent = desc;

            if (type === 'success') {
                tIcon.className = "p-2 rounded-xl bg-emerald-500/10 text-emerald-400";
                tIcon.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i>`;
            } else if (type === 'error') {
                tIcon.className = "p-2 rounded-xl bg-rose-500/10 text-rose-400";
                tIcon.innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5"></i>`;
            } else {
                tIcon.className = "p-2 rounded-xl bg-sky-500/10 text-sky-400";
                tIcon.innerHTML = `<i data-lucide="info" class="w-5 h-5"></i>`;
            }

            lucide.createIcons();

            // Animación de Entrada
            toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-500 pointer-events-auto";
            
            setTimeout(() => {
                // Animación de Salida
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-500 pointer-events-none";
            }, 5000);
        }

        // --- GESTIÓN DE ENVÍO DE FORMULARIO ---

        async function handleFormSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const formElement = document.getElementById('contact-form');
            
            const name = document.getElementById('form-name').value;
            const email = document.getElementById('form-email').value;
            const subject = document.getElementById('form-subject').value;
            const message = document.getElementById('form-message').value;

            // Deshabilitar botón para evitar envíos múltiples
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Enviando...`;
            lucide.createIcons();

            // Si la clave no está configurada, simula un envío perfecto para las pruebas del autor
            if (!WEB3FORMS_ACCESS_KEY || WEB3FORMS_ACCESS_KEY.trim() === "") {
                setTimeout(() => {
                    showToast(
                        '¡Mensaje Enviado!', 
                        'Tu carta ha zarpado exitosamente (Modo Demo)', 
                        'success'
                    );
                    formElement.reset();
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Enviar Mensaje`;
                    lucide.createIcons();
                }, 1200);
                return;
            }

            // Configurar clave en el input antes de enviar
            document.getElementById('web3forms-key').value = WEB3FORMS_ACCESS_KEY.trim();
            const formData = new FormData(formElement);

            // Convertir FormData a JSON para procesar el envío silencioso a Web3Forms
            const jsonObject = {};
            formData.forEach((value, key) => {
                jsonObject[key] = value;
            });

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(jsonObject)
                });

                const result = await response.json();

                if (response.status === 200) {
                    showToast('¡Mensaje Enviado!', 'Tu mensaje ha sido enviado directamente al autor.', 'success');
                    formElement.reset();
                } else {
                    showToast('Error de Envío', result.message || 'No se pudo procesar el mensaje.', 'error');
                }
            } catch (error) {
                showToast('Fallo de Red', 'Hubo un problema de conexión. Inténtalo de nuevo.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Enviar Mensaje`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
